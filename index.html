<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1RugnwC2H-BUfAYhTTHQ_M_BqBCkjoi3j" type="image/png">
    <title>Dashboard HIS</title>
    <style>
        :root {
            /* Paleta Tema Claro Profesional */
            --c-bg-overlay: rgba(241, 245, 249, 0.88); /* Capa clara traslúcida sobre la imagen */
            --c-card-bg: rgba(255, 255, 255, 0.85);    /* Tarjetas blanco cristal */
            --c-card-hover: #FFFFFF;
            --c-border: rgba(226, 232, 240, 0.9);
            --c-border-hover: #025ba8;
            
            --text-title: #0f172a;      /* Azul muy oscuro/negro suave */
            --text-sub: #64748b;        /* Gris medio legible */
            --text-body: #334155;       /* Gris oscuro para descripción */
            
            --c-accent: #0078D4;        /* Azul primario corporativo */
            --c-accent-light: #e0f2fe;  /* Azul claro para fondo del ícono */
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }

        /* ==========================================
           PANTALLA DE SELECCIÓN (CLARA)
           ========================================== */
        #inicio {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;

            /* Imagen de fondo de Drive con filtro claro */
            background-image: linear-gradient(var(--c-bg-overlay), var(--c-bg-overlay)),
                url('https://lh3.googleusercontent.com/d/130hBfvMRiVeUG400VnfAxMVT31JnsP15');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .contenedor {
            width: 100%;
            max-width: 960px;
            text-align: left;
        }

        /* ==========================================
           ENCABEZADO SOBRIO Y ALINEADO
           ========================================== */
        .titulo {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(203, 213, 225, 0.6);
        }

        .titulo h1 {
            margin: 0;
            font-size: clamp(22px, 4vw, 28px);
            color: var(--text-title);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .titulo p {
            margin: 6px 0 0 0;
            color: var(--text-sub);
            font-size: 14.5px;
            font-weight: 400;
        }

        /* ==========================================
           MÓDULOS (TARJETAS CLARAS)
           ========================================== */
        .modulos {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: flex-start;
        }

        .modulo {
            flex: 1 1 260px;
            max-width: 300px;
            padding: 28px 24px;
            background: var(--c-card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid var(--c-border);
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .modulo:hover {
            transform: translateY(-4px);
            background: var(--c-card-hover);
            border-color: var(--c-border-hover);
            box-shadow: 0 12px 25px rgba(15, 23, 42, 0.08);
        }

        /* Iconos */
        .icono {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--c-accent-light);
            color: var(--c-accent);
            transition: all 0.25s ease;
        }

        .icono svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .modulo:hover .icono {
            background: var(--c-accent);
            color: #FFFFFF;
        }

        /* Textos dentro del módulo */
        .modulo h2 {
            margin: 0 0 8px 0;
            color: var(--text-title);
            font-size: 18px;
            font-weight: 600;
        }

        .modulo p {
            color: var(--text-sub);
            font-size: 13.5px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        /* Botón */
        .boton {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 18px;
            background: #f1f5f9;
            color: var(--text-title);
            border: 1px solid var(--c-border);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            align-self: flex-start;
        }

        .modulo:hover .boton {
            background: var(--c-accent);
            border-color: var(--c-accent);
            color: #FFFFFF;
        }

        /* ==========================================
           VISOR DEL EXEC
           ========================================== */
        #visor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: #ffffff;
            z-index: 9999;
        }

        #visor iframe {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 600px) {
            #inicio {
                padding: 24px 16px;
            }

            .modulos {
                justify-content: center;
            }

            .modulo {
                max-width: 100%;
                flex: 1 1 100%;
            }
        }
    </style>
</head>

<body>
    <!-- ==========================================
         SELECTOR INICIAL
         ========================================== -->
    <div id="inicio">
        <div class="contenedor">
            <div class="titulo">
                <h1>Dashboard HIS</h1>
                <p>Seleccione el módulo al que desea acceder</p>
            </div>
            <div class="modulos">
                <!-- REPORTES -->
                <div class="modulo" onclick="abrirModulo('reportes')">
                    <div>
                        <div class="icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                            </svg>
                        </div>
                        <h2>Reportes</h2>
                        <p>Consulta de Reportes Estadísticos.</p>
                    </div>
                    <span class="boton">Ingresar</span>
                </div>

                <!-- CONFIGURACIÓN -->
                <div class="modulo" onclick="abrirModulo('configuracion')">
                    <div>
                        <div class="icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                            </svg>
                        </div>
                        <h2>Configuración</h2>
                        <p>Administración y configuración.</p>
                    </div>
                    <span class="boton">Ingresar</span>
                </div>

                <!-- CAMBIAR CONTRASEÑA -->
                <div class="modulo" onclick="abrirModulo('cambiopass')">
                    <div>
                        <div class="icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" />
                            </svg>
                        </div>
                        <h2>Clave de Acceso</h2>
                        <p>Cambio de contraseña de acceso.</p>
                    </div>
                    <span class="boton">Ingresar</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         VISOR
         ========================================== -->
    <div id="visor">
        <iframe id="iframeModulo" src=""></iframe>
    </div>

    <script>
        const MODULOS = {
            reportes: "https://script.google.com/macros/s/AKfycbzaPhLVDuUJ1ewX6LXByVln1Lnk8Nl3thGWYtgct6m8V_rIvPN6wUW_lWxdpeXthVc0CA/exec",
            configuracion: "https://script.google.com/macros/s/AKfycbwhmfG2xWMIKC18uwvrV-DpresHAyUImtTm4X1FJnaJaOW_LVvOWzD_DT3oKLzb8pynCw/exec",
            cambiopass: "https://script.google.com/macros/s/AKfycbwUqFhnFid4L8wHs1j-kn4jeu6wHDDn1YufcfnfzJuh3IRXrJy_XOk_qhdKn8NJLeJz/exec"
        };

        function abrirModulo(modulo) {
            const url = MODULOS[modulo];
            if (!url) {
                alert("No se encontró el módulo seleccionado.");
                return;
            }
            document.getElementById("inicio").style.display = "none";
            document.getElementById("visor").style.display = "block";
            document.getElementById("iframeModulo").src = url;
        }
    </script>
</body>

</html>
