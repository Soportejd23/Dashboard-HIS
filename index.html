<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="https://lh3.googleusercontent.com/d/1RugnwC2H-BUfAYhTTHQ_M_BqBCkjoi3j" type="image/png">
    <title>Dashboard HIS</title>
    <style>
        :root {
            --bg-main: #F3F3F3;
            --text-primary: #191C1E;
            --text-muted: #605E5C;
            --c-primary: #025ba8;
            --c-secondary: #3a97ef;
            --c-teal: #61CBFF;
            --c-dark-blue: #003966;
            --c-accent: #0078D4;
            --c-amber: #F7630C;
            --c-light-gray: #fafafa;
            --c-success: #107C10;
            --c-danger: #D83B01;
            --c-kpi-blue: #005FB8;
            --c-kpi-light-blue: #61CBFF;
            --c-kpi-purpure: #881798;
            --c-bg-app: #fcfbfb;
            --c-card-bg: #FFFFFF;
            --c-border: #e2e8f0;
            --c-text-main: #191C1E;
            --c-header-sub: #61CBFF;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg-main);
        }

        /* ==========================================
           PANTALLA DE SELECCIÓN
           ========================================== */
        #inicio {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--c-bg-app);
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        .titulo {
            margin-bottom: 35px;
        }

        .titulo h1 {
            margin: 0;
            font-size: 28px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .titulo p {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ==========================================
           MÓDULOS
           ========================================== */
        .modulos {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .modulo {
            width: 280px;
            padding: 30px 25px;
            background: var(--c-card-bg);
            border-radius: 14px;
            border: 1px solid var(--c-border);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .modulo:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(2, 91, 168, 0.12);
            border-color: var(--c-secondary);
            background:  rgba(14, 142, 255, 0.12);
        }

        .modulo:hover .icono {
            background: var(--c-primary);
            color: #FFFFFF;
            transform: scale(1.05);
        }

        .icono {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #e8f3ff;
            /* Tono suave derivado de primary */
            color: var(--c-primary);
            transition: all 0.25s ease;
        }

        .icono svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .modulo h2 {
            margin: 0 0 8px 0;
            color: var(--c-text-main);
            font-size: 19px;
        }

        .modulo p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
            min-height: 40px;
            margin: 0 0 20px 0;
        }

        .boton {
            display: inline-block;
            padding: 10px 22px;
            background: var(--c-primary);
            color: white;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .modulo:hover .boton {
            background: var(--c-accent);
            transform: scale(1.05);
        }

        /* ==========================================
           VISOR DEL EXEC
           ========================================== */
        #visor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: var(--c-card-bg);
            z-index: 9999;
        }

        #visor iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 650px) {
            .modulos {
                flex-direction: column;
                align-items: center;
            }

            .modulo {
                width: 90%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>
    <!-- ==========================================
         SELECTOR INICIAL
         ========================================== -->
    <div id="inicio">
        <div class="contenedor">
            <div class="titulo">
                <h1>DASHBOARD HIS - MÓDULOS</h1>
                <p>Seleccione el módulo que desea utilizar</p>
            </div>
            <div class="modulos">
                <!-- ==============================
                     REPORTES
                     ============================== -->
                <div class="modulo" onclick="abrirModulo('reportes')">
                    <div class="icono">
                        <!-- SVG: Gráfico de barras profesional -->
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                        </svg>
                    </div>
                    <h2>Reportes</h2>
                    <p>Consulta y generación de reportes del sistema.</p>
                    <span class="boton">Ingresar</span>
                </div>

                <!-- ==============================
                     CONFIGURACIÓN
                     ============================== -->
                <div class="modulo" onclick="abrirModulo('configuracion')">
                    <div class="icono">
                        <!-- SVG: Engranaje / Configuración profesional -->
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                        </svg>
                    </div>
                    <h2>Configuración</h2>
                    <p>Administración y configuración del sistema.</p>
                    <span class="boton">Ingresar</span>
                </div>
                <!-- ==============================
                     cambia contraseña
                     ============================== -->
                <div class="modulo" onclick="abrirModulo('cambiopass')">
                    <div class="icono">
                        <!-- SVG: Cambio de Contraseña / Llave Segura -->
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                            <path
                                d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" />
                        </svg>
                    </div>
                    <h2>Clave de Acceso</h2>
                    <p>Cambio de contraseña de acceso</p>
                    <span class="boton">Cambiar</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         VISOR
         ========================================== -->
    <div id="visor">
        <iframe id="iframeModulo" src="" frameborder="0"></iframe>
    </div>

    <script>
        /* ==========================================
           AQUÍ COLOCAS TUS DOS EXEC
           ========================================== */
        const MODULOS = {
            reportes: "https://script.google.com/macros/s/AKfycbzaPhLVDuUJ1ewX6LXByVln1Lnk8Nl3thGWYtgct6m8V_rIvPN6wUW_lWxdpeXthVc0CA/exec",
            configuracion: "https://script.google.com/macros/s/AKfycbwhmfG2xWMIKC18uwvrV-DpresHAyUImtTm4X1FJnaJaOW_LVvOWzD_DT3oKLzb8pynCw/exec",
            cambiopass: "https://script.google.com/macros/s/AKfycbwUqFhnFid4L8wHs1j-kn4jeu6wHDDn1YufcfnfzJuh3IRXrJy_XOk_qhdKn8NJLeJz/exec"
        };

        /* ==========================================
           ABRIR MÓDULO
           ========================================== */
        function abrirModulo(modulo) {
            const url = MODULOS[modulo];
            if (!url) {
                alert("No se encontró el módulo seleccionado.");
                return;
            }
            // Ocultamos completamente el selector.
            document.getElementById("inicio").style.display = "none";
            // Mostramos el visor ocupando TODA la pantalla.
            document.getElementById("visor").style.display = "block";
            // Cargamos el EXEC.
            document.getElementById("iframeModulo").src = url;
        }
    </script>
</body>

</html>
